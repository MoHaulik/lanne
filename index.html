<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crystal Runner - WebXR Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body { 
      margin: 0; 
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }
    #overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1;
    }
    #start-button {
      padding: 14px 28px;
      font-size: 20px;
      background: linear-gradient(135deg, rgba(72, 118, 255, 0.8), rgba(100, 80, 255, 0.9));
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(72, 118, 255, 0.5), 0 0 20px rgba(72, 118, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    #start-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 20px rgba(72, 118, 255, 0.6), 0 0 30px rgba(72, 118, 255, 0.4);
    }
    #status {
      margin-top: 15px;
      font-size: 16px;
      background: rgba(10, 20, 30, 0.6);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #score-display {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 1;
      font-size: 28px;
      font-weight: bold;
      color: white;
      background: rgba(10, 20, 30, 0.6);
      padding: 12px 18px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.1);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start-button">Start Crystal Runner</button>
    <div id="status"></div>
  </div>
  <div id="score-display">Score: 0</div>
  
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';

    let camera, scene, renderer;
    let controller;
    let player;
    let ground;
    let particles = [];
    let obstacles = [];
    let clock = new THREE.Clock();
    let isPlaying = false;
    let playerLane = 1;
    let lanePositions = [-0.4, 0, 0.4];
    let lastControllerRotation = new THREE.Euler();
    let score = 0;
    let gameSpeed = 2.0;
    let spawnInterval = 2.0;
    let lastSpawnTime = 0;
    
    const crystalColors = [
      0x84f7fd,
      0x64acff,
      0xa864ff,
      0x45caff
    ];
    
    let envObjects = [];
    let trailParticles = [];
    
    init();

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x002255, 0.08);
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.setClearColor(0x000000, 0);
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x404040, 2);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
      directionalLight.position.set(1, 1.5, 1);
      scene.add(directionalLight);
      
      const pointLight1 = new THREE.PointLight(0x64acff, 2, 5);
      pointLight1.position.set(0, 0.5, -3);
      scene.add(pointLight1);
      
      const pointLight2 = new THREE.PointLight(0xa864ff, 2, 5);
      pointLight2.position.set(0.5, 0.5, -7);
      scene.add(pointLight2);

      document.getElementById('start-button').addEventListener('click', startARSession);
      window.addEventListener('resize', onWindowResize);
    }

    function updateStatus(message) {
      const el = document.getElementById('status');
      el.style.display = 'block';
      el.textContent = message;
    }

    function updateScore(newScore) {
      score = newScore;
      const el = document.getElementById('score-display');
      el.style.display = 'block';
      el.textContent = `Score: ${score}`;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function startARSession() {
      if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-ar').then(supported => {
          if (supported) {
            const sessionInit = {
              requiredFeatures: ['hit-test'],
              optionalFeatures: ['dom-overlay'],
              domOverlay: { root: document.body }
            };
            navigator.xr.requestSession('immersive-ar', sessionInit).then(onSessionStarted);
          } else {
            updateStatus('WebXR AR session is not supported on this device.');
          }
        });
      } else {
        updateStatus('WebXR is not supported in this browser.');
      }
    }

    function onSessionStarted(session) {
      renderer.xr.setReferenceSpaceType('local');
      renderer.xr.setSession(session);
      document.getElementById('start-button').style.display = 'none';
      updateStatus('Creating crystal world...');
      updateScore(0);

      createGameEnvironment();
      createPlayer();
      createParticleSystem();
      setupController(session);

      renderer.setAnimationLoop(render);
      session.addEventListener('end', onSessionEnd);

      isPlaying = true;
      updateStatus('Rotate controller to change lanes!');
    }

    function onSessionEnd() {
      isPlaying = false;
      updateStatus('Game ended');
      document.getElementById('start-button').style.display = 'block';
      document.getElementById('score-display').style.display = 'none';

      if (player) scene.remove(player);
      if (ground) scene.remove(ground);
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];
      envObjects.forEach(o => scene.remove(o));
      envObjects = [];
      particles.forEach(p => scene.remove(p));
      particles = [];
      trailParticles.forEach(p => scene.remove(p));
      trailParticles = [];
    }

    function createGameEnvironment() {
      // Simple box for ground
      const gGeom = new THREE.BoxGeometry(1.5, 0.02, 10);
      const gMat = new THREE.MeshBasicMaterial({
        color: 0x203a55,
        transparent: true,
        opacity: 0.7
      });
      ground = new THREE.Mesh(gGeom, gMat);
      ground.position.set(0, -0.1, -5);
      scene.add(ground);
      envObjects.push(ground);

      // Simple lanes
      for (let i = 0; i < 3; i++) {
        const lm = new THREE.Mesh(
          new THREE.BoxGeometry(0.03, 0.03, 10),
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.7
          })
        );
        lm.position.set((i - 1) * 0.4, -0.08, -5);
        scene.add(lm);
        envObjects.push(lm);
      }

      // Simple decorative crystals
      for (let i = 0; i < 16; i++) {
        const size = 0.03 + Math.random() * 0.06;
        const color = crystalColors[Math.floor(Math.random() * crystalColors.length)];
        const crys = createSimpleCrystal(size, color);
        const side = Math.random() > 0.5 ? 1 : -1;
        crys.position.set(side * 0.6 + (Math.random() * 0.2 * side), -0.08 + size/2, -2 - i * 0.6);
        crys.rotation.y = Math.random() * Math.PI * 2;
        scene.add(crys);
        envObjects.push(crys);
      }
    }

    function createSimpleCrystal(size, color) {
      // Using simple tetrahedron for crystals
      const geom = new THREE.TetrahedronGeometry(size);
      const mat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.7
      });
      return new THREE.Mesh(geom, mat);
    }

    function createPlayer() {
      // Create a soap bubble player using a simple sphere
      const grp = new THREE.Group();
      
      // Outer bubble shell
      const sphereGeom = new THREE.SphereGeometry(0.1, 16, 16);
      const bubbleMat = new THREE.MeshBasicMaterial({
        color: 0x4876ff,
        transparent: true,
        opacity: 0.3
      });
      const bubble = new THREE.Mesh(sphereGeom, bubbleMat);
      grp.add(bubble);
      
      // Inner bubble shell for depth effect
      const innerSphereGeom = new THREE.SphereGeometry(0.08, 12, 12);
      const innerBubbleMat = new THREE.MeshBasicMaterial({
        color: 0x64acff,
        transparent: true,
        opacity: 0.2
      });
      const innerBubble = new THREE.Mesh(innerSphereGeom, innerBubbleMat);
      grp.add(innerBubble);
      
      // Add a point light to make it glow
      const bubbleLight = new THREE.PointLight(0x4876ff, 1.5, 0.3);
      grp.add(bubbleLight);
      
      grp.position.set(lanePositions[playerLane], 0, -1);
      player = grp;
      scene.add(player);
    }

    function createParticleSystem() {
      // Simple particle system
      for (let i = 0; i < 50; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.01 + Math.random() * 0.02, 8, 8),
          new THREE.MeshBasicMaterial({
            color: crystalColors[Math.floor(Math.random() * crystalColors.length)],
            transparent: true,
            opacity: 0.6
          })
        );
        p.position.set((Math.random() - 0.5) * 2, Math.random() * 0.5, -Math.random() * 10);
        scene.add(p);
        particles.push(p);
      }
    }

    function setupController(session) {
      controller = renderer.xr.getController(0);
      controller.addEventListener('connected', e => updateStatus(`Controller connected: ${e.data.handedness}. Rotate to change lanes!`));
      scene.add(controller);
      
      // Simple controller visualization
      const cg = new THREE.Group();
      const geom = new THREE.CylinderGeometry(0.01, 0.02, 0.1, 16);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff4500
      });
      const cm = new THREE.Mesh(geom, mat);
      cm.rotation.x = Math.PI/2;
      cg.add(cm);
      controller.add(cg);
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * 3);
      const grp = new THREE.Group();
      
      // Use a simple cube for obstacles
      const color = crystalColors[Math.floor(Math.random() * crystalColors.length)];
      const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const material = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.7
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      grp.add(mesh);
      
      // Simple light inside obstacle
      const obstacleLight = new THREE.PointLight(color, 1, 0.3);
      grp.add(obstacleLight);
      
      grp.position.set(lanePositions[lane], 0, -10);
      grp.userData = { isObstacle: true, lane };
      scene.add(grp);
      obstacles.push(grp);
    }

    function checkCollisions() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        if (player.position.distanceTo(o.position) < 0.25) {
          updateStatus('Collision! Game over.');
          isPlaying = false;
          createExplosionEffect(player.position);
          
          // Change player color to red on collision
          player.children[0].material.color.set(0xff0000);
          player.children[1].material.color.set(0xff0000);
          player.children[2].color.set(0xff0000);
          
          setTimeout(resetGame, 2000);
          return true;
        }
      }
      return false;
    }

    function createExplosionEffect(pos) {
      // Simple explosion effect using spheres
      for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.03, 8, 8),
          new THREE.MeshBasicMaterial({ 
            color: 0xff5500, 
            transparent: true, 
            opacity: 0.8 
          })
        );
        p.position.copy(pos);
        p.userData = {
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.1,
            (Math.random() - 0.5) * 0.1,
            (Math.random() - 0.5) * 0.1
          ),
          life: 1.0
        };
        scene.add(p);
        trailParticles.push(p);
      }
      
      // Flash effect
      const flash = new THREE.PointLight(0xffffff, 3, 1.5);
      flash.position.copy(pos);
      scene.add(flash);
      setTimeout(() => scene.remove(flash), 200);
    }

    function resetGame() {
      updateScore(0);
      playerLane = 1;
      gameSpeed = 2.0;
      isPlaying = true;
      player.position.set(lanePositions[playerLane], 0, -1);
      
      // Reset player colors
      player.children[0].material.color.set(0x4876ff);
      player.children[1].material.color.set(0x64acff);
      player.children[2].color.set(0x4876ff);
      
      obstacles.forEach(o => scene.remove(o));
      obstacles = [];
      trailParticles.forEach(p => scene.remove(p));
      trailParticles = [];
      updateStatus('Game restarted! Rotate controller to change lanes.');
    }

    function handleControllerRotation() {
      if (!controller || !isPlaying) return;
      const rot = new THREE.Euler().setFromQuaternion(controller.quaternion);
      const d = rot.z - lastControllerRotation.z;
      if (Math.abs(d) > 0.1) {
        playerLane = d > 0 ? Math.min(playerLane + 1, 2) : Math.max(playerLane - 1, 0);
        updateStatus(`Changed to ${['left', 'center', 'right'][playerLane]} lane`);
        createTrailEffect(player.position, 10);
      }
      
      // Smooth player movement
      const tx = lanePositions[playerLane];
      player.position.x += (tx - player.position.x) * 0.2;
      player.position.y = Math.sin(clock.getElapsedTime() * 3) * 0.02;
      player.rotation.y += (tx - player.position.x) * 0.1;
      
      // Bubble wobble effect
      player.children[0].scale.set(
        1 + Math.sin(clock.getElapsedTime() * 5) * 0.03,
        1 + Math.cos(clock.getElapsedTime() * 6) * 0.03,
        1 + Math.sin(clock.getElapsedTime() * 7) * 0.03
      );
      
      lastControllerRotation.copy(rot);
    }

    function createTrailEffect(pos, count) {
      // Simple trail particles
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.01 + Math.random() * 0.02, 8, 8),
          new THREE.MeshBasicMaterial({ 
            color: 0x64acff, 
            transparent: true, 
            opacity: 0.7 
          })
        );
        p.position.copy(pos);
        p.position.x += (Math.random() - 0.5) * 0.1;
        p.position.y += (Math.random() - 0.5) * 0.1;
        p.position.z += (Math.random() - 0.5) * 0.1;
        p.userData = {
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.03,
            Math.random() * 0.03,
            (Math.random() - 0.5) * 0.03
          ),
          life: 0.7 + Math.random() * 0.3
        };
        scene.add(p);
        trailParticles.push(p);
      }
    }

    function updateObstacles(dt) {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.position.z += gameSpeed * dt;
        
        // Simple rotation for obstacles
        o.rotation.x += dt * 0.5;
        o.rotation.y += dt * 0.8;
        
        if (o.position.z > 0) {
          scene.remove(o);
          obstacles.splice(i, 1);
          updateScore(score + 10);
          gameSpeed += 0.05;
          
          // Success flash
          const flash = new THREE.PointLight(0x00ff00, 1, 1);
          flash.position.set(o.position.x, o.position.y, 0);
          scene.add(flash);
          setTimeout(() => scene.remove(flash), 300);
        }
      }
      
      // Spawn new obstacles
      if (clock.getElapsedTime() - lastSpawnTime > spawnInterval) {
        spawnObstacle();
        lastSpawnTime = clock.getElapsedTime();
        spawnInterval = Math.max(0.8, spawnInterval - 0.05);
      }
    }

    function updateParticles(dt) {
      // Update background particles
      particles.forEach(p => {
        p.position.y -= dt * 0.2;
        if (p.position.y < -0.2) {
          p.position.y = 0.5;
          p.position.z = -Math.random() * 10;
          p.position.x = (Math.random() - 0.5) * 2;
        }
      });
      
      // Update trail particles
      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.position.add(p.userData.velocity);
        p.userData.life -= dt;
        p.material.opacity = p.userData.life * 0.7;
        if (p.userData.life <= 0) {
          scene.remove(p);
          trailParticles.splice(i, 1);
        }
      }
    }

    function render(time, frame) {
      const dt = clock.getDelta();
      if (frame && isPlaying) {
        handleControllerRotation();
        updateObstacles(dt);
        updateParticles(dt);
        
        // Add occasional trail particles
        if (Math.random() < 0.05) createTrailEffect(player.position, 1);
        
        checkCollisions();
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
